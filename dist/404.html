<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GeoQuery Dashboard</title>
  <script>
    // GitHub Pages 404 redirect trick for React Router
    // Encodes the full path as a query param and redirects to index.html
    // index.html then decodes it and pushes to React Router history
    var path = window.location.pathname;
    var base = "/geoquery-dashboard";

    // Strip base from path
    var route = path.replace(base, "") || "/";

    // Redirect to index with route encoded as query param
    var search = window.location.search;
    var hash   = window.location.hash;

    var redirectUrl = base + "/?redirect=" + encodeURIComponent(route + search + hash);
    window.location.replace(redirectUrl);
  </script>
</head>
<body></body>
</html>
